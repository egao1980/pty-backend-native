name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (input, else v* tag, else .asd :version)"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

jobs:
  natives:
    uses: ./.github/workflows/natives.yml

  publish:
    needs: natives
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: pty-backend-native
      # Empty: the v* tag, else the .asd :version (resolved by the reusable workflow).
      version: ${{ inputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      source-paths: |
        pty-backend-native.asd
        src
        native
        LICENSE
        README.md
    secrets: inherit
